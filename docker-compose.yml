version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+psycopg://ledgerlens:ledgerlens@db:5432/ledgerlens
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=ledgerlens
      - POSTGRES_PASSWORD=ledgerlens
      - POSTGRES_DB=ledgerlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
