services:
  # LedgerLens FastAPI Intelligence Engine
  - type: web
    name: ledgerlens-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "https://ledgerlens.vercel.app,http://localhost:3000"
      - key: PYTHON_VERSION
        value: 3.11.0
